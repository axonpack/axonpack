name: Release

# Runs when a PR into main is merged, and on demand. `pull_request_target` rather than
# `pull_request` because a PR from a fork would otherwise get a read-only token and no OIDC token,
# and could never publish. It is safe here for one reason only: every checkout below is `main`,
# never the PR's own code. Keep it that way. There is no `push` trigger, so a direct push to main
# releases nothing; branch protection stops those anyway.
#
# With changesets pending, a merge does two things at once: publishes a canary of what changed and
# opens or refreshes the Version Packages PR. Merging that PR leaves no changesets, and its branch
# name routes it to the stable publish.
on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "canary cuts a snapshot from main. stable refreshes the Version Packages PR, or publishes when nothing is pending."
        type: choice
        options: [canary, stable]
        default: canary

# Never cancel a run mid-publish: a half-published release is worse than a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Pick the channel
    runs-on: ubuntu-latest
    # A closed-but-not-merged PR is nothing to release. A dispatch from any other branch would
    # publish that branch, so only main counts.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    outputs:
      pending: ${{ steps.pick.outputs.pending }}
      channel: ${{ steps.pick.outputs.channel }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pick the channel
        id: pick
        # Through env, not inline: a branch name is contributor-controlled text, and interpolating
        # it straight into a script under this event's permissions is a script injection.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if compgen -G ".changeset/*.md" > /dev/null && [ -n "$(ls .changeset/*.md | grep -v README.md)" ]; then
            pending=true
          else
            pending=false
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            channel="$INPUT_CHANNEL"
          # The Version Packages PR is the release by definition; its branch name is set by the action.
          elif [ "$HEAD_REF" = "changeset-release/main" ]; then
            channel=stable
          else
            channel=canary
          fi
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "pending changesets: $pending, channel: $channel"

  # Publishes a canary of every package with a pending changeset, under the `canary` dist-tag. The
  # snapshot rewrites versions in this checkout only: nothing is committed, `main` still says the
  # stable version, and the same changesets feed the Version Packages PR beside this job.
  canary:
    name: Canary Release
    needs: plan
    if: needs.plan.outputs.pending == 'true' && (github.event_name == 'pull_request_target' || needs.plan.outputs.channel == 'canary')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm swaps this run's OIDC token for a short-lived publish token, so
      # there is no npm secret to leak or rotate, and every release gets provenance with it.
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, and the npm bundled with Node 24 can be older.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Version snapshot
        run: bunx changeset version --snapshot canary

      - name: Build packages
        run: bun run build

      - name: Publish canary
        run: bunx changeset publish --tag canary --no-git-tag

  # Opens or refreshes the Version Packages PR from `changeset-release/main`: the version bumps, the
  # changelog entries and the refreshed lockfile, for a person to read before anything ships.
  release-pr:
    name: Release PR
    needs: plan
    if: needs.plan.outputs.pending == 'true' && (github.event_name == 'pull_request_target' || needs.plan.outputs.channel == 'stable')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0

      # `version-packages` also refreshes the lockfile, which records each workspace's version. Without
      # that the PR would fail its own frozen-lockfile install, which is what broke the 3.2.0 release.
      - name: Open or update the Version Packages PR
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          commit: "release: version packages"
          title: "release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0

  # The only publish to `latest`. Reached by merging the Version Packages PR, which leaves no
  # changesets behind, or by a manual run.
  stable:
    name: Stable Release
    needs: plan
    if: needs.plan.outputs.pending == 'false' && needs.plan.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build packages
        run: bun run build

      - name: Publish to npm
        run: bunx changeset publish

      - name: Push release tags
        run: git push origin --tags
