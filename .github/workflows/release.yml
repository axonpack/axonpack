name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a run mid-publish: a half-published release is worse than a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for pending changesets
        id: changesets
        run: |
          if compgen -G ".changeset/*.md" > /dev/null && [ -n "$(ls .changeset/*.md | grep -v README.md)" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.changesets.outputs.pending == 'true'
        run: bun run version-packages

      - name: Commit version bump
        if: steps.changesets.outputs.pending == 'true'
        env:
          HUSKY: 0
        run: |
          git add .
          git commit -m "release: version packages"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build packages
        run: bun run build

      - name: Publish to npm
        run: bunx changeset publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # `changeset publish` tags only what it actually publishes. A version published from a laptop
      # leaves this job with nothing to publish and so nothing to tag — which is how 7 of the first 11
      # tags never reached the remote, including the one for the latest release. `changeset tag` reads
      # the versions in the tree and tags each one, whoever published it, and skips tags that exist.
      #
      # It tags **HEAD**, not the commit a version was published from — which is correct here, where
      # it runs on the release commit itself, and wrong anywhere else. Do not use it to back-fill a
      # tag for an older release: it would point at the wrong commit. Create those by hand from the
      # commit that bumped the version.
      - name: Tag released versions
        run: bunx changeset tag

      - name: Push release tags
        run: git push origin --tags
