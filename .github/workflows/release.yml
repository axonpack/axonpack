name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a run mid-publish: a half-published release is worse than a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted publishing: npm swaps this run's OIDC token for a short-lived publish token, so
      # there is no npm secret to leak or rotate, and every release gets provenance with it.
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer, and the npm bundled with Node 24 can be older.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Check for pending changesets
        id: changesets
        run: |
          if compgen -G ".changeset/*.md" > /dev/null && [ -n "$(ls .changeset/*.md | grep -v README.md)" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version packages
        if: steps.changesets.outputs.pending == 'true'
        run: bun run version-packages

      - name: Commit version bump
        if: steps.changesets.outputs.pending == 'true'
        env:
          HUSKY: 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "release: version packages"
          git push origin HEAD:${{ github.ref_name }}

      - name: Build packages
        run: bun run build

      - name: Publish to npm
        run: bunx changeset publish

      - name: Push release tags
        run: git push origin --tags
