name: CI

on:
  pull_request:
    # `labeled` is here so adding the `preview` label starts a run, rather than waiting for a push.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0

      # Build before anything else: expo-devtools reaches react-pretty-print through its compiled
      # `default` export, so lint, types and tests all need the sibling builds on disk.
      - name: Build packages
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Check types
        run: bun run check-types

      - name: Test
        run: bun run test

  # A PR carrying the `preview` label gets its packages published to pkg.pr.new, so a reviewer or a
  # tester can install the branch. Nothing reaches npm, and nothing runs for a PR without the label.
  preview:
    name: Preview build
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Build packages
        run: bun run build

      - name: Publish to pkg.pr.new
        run: |
          bunx pkg-pr-new publish \
            ./packages/@axonpack/expo-devtools \
            ./packages/@axonpack/react-native-devtools-tab \
            ./packages/@axonpack/react-pretty-print
