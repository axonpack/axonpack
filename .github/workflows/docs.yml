name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs.yml'
      - 'bun.lock'
  pull_request:
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs.yml'
      - 'bun.lock'
  workflow_dispatch:

# A superseded deploy is just stale, so cancelling one is free — the opposite call from `release.yml`,
# where a half-published run is worse than a queued one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # The site is served from the organisation root, https://axonpack.github.io, which means no path
  # prefix and so no NEXT_PUBLIC_BASE_PATH. Only a repo literally named `<org>.github.io` gets that
  # URL, which is why the build happens here and the output is pushed to `axonpack/axonpack.github.io`.
  NEXT_PUBLIC_SITE_URL: https://axonpack.github.io

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Lint and typecheck
        run: bunx turbo run lint check-types --filter=axonpack-docs

      # `output: 'export'` writes a plain directory of files to apps/docs/out. Nothing here needs a
      # Node server at runtime, which is the whole reason Pages can host it.
      - name: Build static export
        run: bunx turbo run build --filter=axonpack-docs

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-export
          path: apps/docs/out
          retention-days: 7
          include-hidden-files: true

  deploy:
    name: Deploy
    # A pull request builds to prove it still compiles, and stops there — only main is published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download export
        uses: actions/download-artifact@v4
        with:
          name: docs-export
          path: out

      # `axonpack/axonpack.github.io` holds build output and nothing else, so each deploy replaces its
      # history rather than adding to it — a docs site committed page-by-page would grow without
      # bound. Never hand-edit anything in that repo; this force-push will discard it.
      - name: Publish to axonpack.github.io
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          cd out
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push -f git@github.com:axonpack/axonpack.github.io.git main
